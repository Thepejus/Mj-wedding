<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#10291F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="M&amp;J Access">
<title>Mary &amp; Joseph · 25 March 2027</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Montserrat:wght@500;600;700;800&family=Karla:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --olive-950:#0A1D15; --olive-900:#10291F; --olive-800:#163528; --olive-700:#1D4232; --olive-600:#2A5844; --sage:#B7C4B6;
  --green:#10291F;
  --burg-900:#3E0F1A; --burg-800:#561626; --burg-700:#5E2335; --burg-500:#8E2D41;
  --gold-300:#F1E2B0; --gold-400:#E3CB8A; --gold-500:#D2AE66; --gold-600:#A88638; --gold-700:#7E6328;
  --cream:#F5ECD7; --ink:#1A1D12;
  --ok:#2F7D3A; --bad:#A3172F; --warn:#B26A12;
  --serif:'Cormorant Garamond', Georgia, 'Times New Roman', serif;
  --caps:'Montserrat', -apple-system, 'Helvetica Neue', Arial, sans-serif;
  --sans:'Karla', -apple-system, 'Helvetica Neue', Arial, sans-serif;
  --gold:linear-gradient(135deg,#7E6328 0%,#C9A75A 22%,#F1E2B0 45%,#C9A75A 62%,#8E6E2E 100%);
  --line:rgba(227,203,138,.28);
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{
  font-family:var(--sans);font-size:16px;line-height:1.5;color:var(--gold-300);
  background:var(--olive-950) radial-gradient(120% 60% at 50% 0%,#1D4232 0%,#10291F 55%,#0A1D15 100%) no-repeat;
  -webkit-font-smoothing:antialiased;
  padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px);
}
[hidden]{display:none!important}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;-webkit-tap-highlight-color:transparent}
input,select{font-size:16px}
:focus-visible{outline:2px solid var(--gold-400);outline-offset:2px}
a{color:var(--gold-400)}

.wrap{max-width:440px;margin:0 auto;padding:22px 16px 48px}
.wrap.wide{max-width:720px}
.center{text-align:center}
.small{font-size:14px;color:var(--sage)}
.err{color:#F2A6B4;font-size:14px;min-height:1.2em;margin:8px 0}
.mt{margin-top:14px}.mb{margin-bottom:14px}

/* ---------- access pass ---------- */
.ticket{max-width:400px;margin:0 auto;border-radius:24px;padding:11px;background:var(--green);border:3px solid var(--gold-500);box-shadow:0 30px 60px -24px rgba(0,0,0,.75)}
.ticket-in{border:1.5px solid rgba(210,174,102,.45);border-radius:16px;padding:34px 20px 22px;text-align:center}
.mono{width:112px;height:112px;margin:0 auto 22px;border-radius:50%;border:3px solid var(--gold-500);display:grid;place-items:center;
  font-family:var(--caps);font-weight:800;font-size:46px;color:var(--gold-500);letter-spacing:.01em;line-height:1}
.mono.sm{width:72px;height:72px;font-size:28px;border-width:2px;margin-bottom:14px}
.names{font-family:var(--caps);font-weight:700;font-size:clamp(23px,7.2vw,30px);letter-spacing:.06em;color:var(--gold-500);white-space:nowrap}
.sub{font-family:var(--caps);font-weight:500;font-size:clamp(13px,4.1vw,17px);letter-spacing:.08em;color:var(--cream);margin-top:6px}
.rule{width:62%;height:3px;background:var(--gold-500);margin:22px auto 24px;border-radius:2px}
.t-title{font-family:var(--caps);font-weight:800;font-size:clamp(16px,5.4vw,26px);letter-spacing:.05em;line-height:1.1;color:var(--cream);white-space:nowrap}
.kicker{font-family:var(--caps);font-weight:700;font-size:clamp(14px,4.3vw,18px);letter-spacing:.08em;color:var(--gold-500);margin-top:12px}
.pill{width:88%;margin:22px auto 0;padding:12px 14px;border-radius:999px;background:var(--burg-700);color:var(--cream);
  font-family:var(--caps);font-weight:700;font-size:clamp(13px,3.9vw,15px);letter-spacing:.06em}
.t-guest{font-family:var(--caps);font-weight:700;font-size:clamp(23px,7vw,30px);letter-spacing:.05em;text-transform:uppercase;color:var(--cream);margin-top:24px;line-height:1.15;overflow-wrap:anywhere}
.t-meta{font-family:var(--caps);font-weight:500;font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:var(--gold-500);margin-top:8px}
.t-qr{width:min(250px,68vw);margin:22px auto 0;background:#fff;border-radius:16px;padding:16px}
.t-qr svg{display:block;width:100%;height:auto}
.t-foot{font-family:var(--caps);font-weight:700;font-size:clamp(11px,3.4vw,16px);letter-spacing:.04em;color:var(--cream);margin-top:24px;white-space:nowrap}
.t-addr{display:inline-block;margin-top:8px;font-family:var(--caps);font-weight:500;font-size:clamp(11px,3.4vw,13px);letter-spacing:.06em;color:var(--gold-500);text-decoration:underline;text-decoration-color:rgba(210,174,102,.45);text-underline-offset:4px}
.t-rules{margin:16px auto 0;padding-top:14px;border-top:1px solid rgba(210,174,102,.3);font-family:var(--caps);font-weight:600;font-size:clamp(9px,2.8vw,12px);letter-spacing:.07em;line-height:1.8;color:var(--cream)}
.t-rules span{display:block;white-space:nowrap}
.t-status{font-family:var(--caps);font-weight:500;font-size:clamp(10px,3vw,12px);letter-spacing:.08em;color:var(--gold-500);margin-top:12px}
.t-status .done{color:var(--cream);font-weight:700}
.lead{font-family:var(--caps);font-weight:600;font-size:17px;line-height:1.45;color:var(--cream)}
.hint{text-align:center;font-size:14px;color:var(--sage);margin:18px auto 0;max-width:320px}

/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:12px;
  background:var(--gold);color:var(--olive-950);font-weight:700;font-size:15px;text-decoration:none;white-space:nowrap}
.btn.ghost{background:transparent;color:var(--gold-300);border:1px solid rgba(227,203,138,.4)}
.btn.sm{min-height:38px;padding:0 13px;font-size:14px;border-radius:9px}
.btn.block{width:100%}
.btn:disabled{opacity:.55}
.link{color:var(--gold-400);text-decoration:underline;text-underline-offset:3px;font-size:14px}
.panel{background:rgba(23,27,15,.62);border:1px solid var(--line);border-radius:18px;padding:20px}
.label{display:block;font-size:14px;color:var(--gold-400);margin:16px 0 6px}
.input{width:100%;min-height:50px;padding:0 14px;border-radius:12px;background:rgba(0,0,0,.28);border:1px solid rgba(227,203,138,.32);color:var(--cream)}
.input::placeholder{color:#8f9474}
select.input{appearance:none;-webkit-appearance:none}
.seg{display:flex;gap:4px;padding:4px;border-radius:12px;background:rgba(0,0,0,.25);border:1px solid var(--line)}
.seg>*{flex:1;min-height:42px;display:grid;place-items:center;border-radius:9px;color:var(--gold-300);font-size:14px;font-weight:500;text-decoration:none}
.seg>.on{background:var(--burg-700);box-shadow:inset 0 0 0 1px var(--gold-600);color:var(--cream)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.bar-who{font-size:13px;color:var(--sage)}
.bar-title{font-family:var(--caps);font-weight:700;font-size:24px;letter-spacing:.02em;line-height:1.1;color:var(--cream)}
.spin{width:28px;height:28px;margin:24px auto;border:2px solid rgba(227,203,138,.25);border-top-color:var(--gold-500);border-radius:50%;animation:sp .9s linear infinite}
.spin.lg{width:56px;height:56px;border-width:3px;border-color:rgba(255,255,255,.25);border-top-color:#fff}
@keyframes sp{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);transform:translateX(-50%);z-index:80;
  max-width:calc(100% - 32px);background:var(--cream);color:var(--olive-950);padding:12px 18px;border-radius:12px;font-size:15px;font-weight:500;
  box-shadow:0 10px 30px rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}

/* ---------- scanner ---------- */
.viewport{position:relative;aspect-ratio:3/4;border-radius:20px;overflow:hidden;background:#000;border:1px solid var(--gold-600)}
.viewport video{width:100%;height:100%;object-fit:cover;display:block}
.reticle{position:absolute;inset:20% 14%;pointer-events:none}
.reticle i{position:absolute;width:36px;height:36px;border:3px solid var(--gold-400)}
.reticle i:nth-child(1){top:0;left:0;border-right:0;border-bottom:0;border-top-left-radius:12px}
.reticle i:nth-child(2){top:0;right:0;border-left:0;border-bottom:0;border-top-right-radius:12px}
.reticle i:nth-child(3){bottom:0;left:0;border-right:0;border-top:0;border-bottom-left-radius:12px}
.reticle i:nth-child(4){bottom:0;right:0;border-left:0;border-top:0;border-bottom-right-radius:12px}
.start{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;background:rgba(23,27,15,.88)}
.scan-meta{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:12px;font-size:14px;color:var(--sage)}
.m-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.m-row:last-child{border-bottom:0}
.result{position:fixed;inset:0;z-index:70;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#fff;
  padding:calc(env(safe-area-inset-top,0px) + 24px) 24px calc(env(safe-area-inset-bottom,0px) + 24px)}
.result.ok{background:var(--ok)}.result.bad{background:var(--bad)}.result.warn{background:var(--warn)}
.result.check{background:rgba(23,27,15,.94)}.result.err{background:#3B3B35}
.result .icon{width:92px;height:92px;border-radius:50%;border:3px solid rgba(255,255,255,.85);display:grid;place-items:center;font-size:46px;font-weight:700;margin-bottom:18px}
.result .big{font-size:30px;font-weight:700;line-height:1.15}
.result .who{font-family:var(--serif);font-weight:600;font-size:40px;line-height:1.1;margin-top:14px;overflow-wrap:anywhere}
.result .det{font-size:17px;opacity:.92;margin-top:10px}
.result .btn{margin-top:30px;background:#fff;color:#111;min-width:220px}

/* ---------- admin ---------- */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{padding:12px 8px;text-align:center;border-radius:14px;background:rgba(23,27,15,.62);border:1px solid var(--line)}
.stat b{display:block;font-family:var(--serif);font-weight:600;font-size:30px;line-height:1.1;color:var(--cream)}
.stat span{font-size:12px;color:var(--gold-400)}
.stat small{font-size:12px;color:var(--sage)}
.filters{display:grid;grid-template-columns:1fr auto auto;gap:8px;margin:14px 0}
.filters select.input{width:auto;max-width:44vw}
.g{padding:14px 16px;margin-bottom:10px;border-radius:14px;background:rgba(23,27,15,.62);border:1px solid var(--line)}
.g-name{font-family:var(--serif);font-weight:600;font-size:22px;line-height:1.15;color:var(--cream)}
.g-sub{font-size:13px;color:var(--sage);margin-top:2px}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 12px}
.b{font-size:12px;padding:3px 9px;border-radius:999px;border:1px solid var(--line);color:var(--sage)}
.b.y{background:rgba(201,167,90,.18);color:var(--gold-300)}
.b.g{background:rgba(47,125,58,.35);border-color:rgba(91,170,104,.6);color:#D3F0D8}
.b.r{background:rgba(142,45,65,.4);border-color:rgba(190,80,100,.6);color:#F6CCD5}
.g-actions{display:flex;flex-wrap:wrap;gap:6px;align-items:flex-start}
.more summary{list-style:none}
.more summary::-webkit-details-marker{display:none}
.more[open]{flex-basis:100%}
.menu{margin-top:8px;padding:6px;border-radius:12px;background:var(--olive-900);border:1px solid rgba(227,203,138,.35)}
.menu button{display:block;width:100%;text-align:left;padding:12px;border-radius:8px;font-size:15px;color:var(--gold-300)}
.menu button.danger{color:#F6B3C0}
.empty{text-align:center;color:var(--sage);padding:30px 0}
@media (prefers-reduced-motion:reduce){*{animation-duration:0s!important;transition:none!important}}
</style>
</head>
<body>
<main id="app"></main>

<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script>
'use strict';

/* ======================= CONFIG ======================= */
// Paste your Apps Script web app URL here (Deploy → Web app → URL ending in /exec).
const API_URL = 'https://script.google.com/macros/s/AKfycbyPmGD7rRzsysSMls94JOj59AMpmdElWocKoiR4wQwic2JWDSVHWWhFlBZhGS3wMBRJmg/exec';
const JSQR_URL = 'https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js';
const EVENT = { foot: '25 MARCH 2027 &nbsp;|&nbsp; MERIDIAN GRAND', address: 'ADVENT WAY, LONDON N18 3AF', map: 'https://www.google.com/maps/search/?api=1&query=Meridian+Grand+Advent+Way+London+N18+3AF' };
/* ====================================================== */

const $ = (s, el = document) => el.querySelector(s);
const app = $('#app');
const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const store = {
  get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};
const session = () => store.get('mj_session');
let timers = [], adminPoll = null;
const later = (fn, ms) => { timers.push(setTimeout(fn, ms)); };

function toast(msg) {
  let t = $('#toast');
  if (!t) { t = document.createElement('div'); t.id = 'toast'; t.className = 'toast'; t.setAttribute('role', 'status'); document.body.appendChild(t); }
  t.textContent = msg; t.classList.add('on');
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('on'), 2800);
}

async function api(action, data) {
  if (!/^https:\/\//.test(API_URL)) throw Object.assign(new Error('Not connected yet: set API_URL in index.html'), { code: 'CONFIG' });
  let res, j;
  try { res = await fetch(API_URL, { method: 'POST', body: JSON.stringify(Object.assign({ action }, data || {})) }); }
  catch (e) { throw Object.assign(new Error('No connection. Check signal or Wi-Fi and try again.'), { code: 'NETWORK' }); }
  try { j = await res.json(); }
  catch (e) { throw Object.assign(new Error('Server did not respond properly. Try again.'), { code: 'SERVER' }); }
  if (!j.ok) throw Object.assign(new Error(j.message || j.error), { code: j.error });
  return j;
}

function authFail(e) {
  if (e.code !== 'SESSION' && e.code !== 'FORBIDDEN') return false;
  store.del('mj_session'); toast(e.message);
  if (location.hash === '#staff') route(); else location.hash = '#staff';
  return true;
}

const loaded = {};
function loadScript(src) {
  if (!loaded[src]) loaded[src] = new Promise((res, rej) => {
    const s = document.createElement('script'); s.src = src; s.onload = res;
    s.onerror = () => { delete loaded[src]; rej(new Error('Could not load the scanner. Check connection.')); };
    document.head.appendChild(s);
  });
  return loaded[src];
}

/* ======================= shared pieces ======================= */
const mono = sm => `<div class="mono${sm ? ' sm' : ''}" aria-hidden="true">JM</div>`;
const heading = () => `<p class="names">MARY &amp; JOSEPH</p><p class="sub">TRADITIONAL WEDDING</p><div class="rule"></div>`;
const shell = inner => `<div class="wrap"><div class="ticket"><div class="ticket-in">${heading()}${inner}</div></div></div>`;
const loadingView = msg => shell(`<div class="spin"></div><p class="small">${esc(msg)}</p>`);
const notice = (title, body, extra) => shell(`<p class="lead">${esc(title)}</p><p class="small mt">${esc(body)}</p>${extra ? `<div class="mt">${extra}</div>` : ''}`);

function qrSvg(text) {
  const q = qrcode(0, 'Q'); q.addData(text); q.make();
  const n = q.getModuleCount(); let d = '';
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (q.isDark(r, c)) d += `M${c} ${r}h1v1h-1z`;
  return `<svg viewBox="0 0 ${n} ${n}" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges" role="img" aria-label="Your personal access QR code">
    <rect width="${n}" height="${n}" fill="#FFFFFF"/><path d="${d}" fill="#10291F"/></svg>`;
}
const cardUrl = t => `${location.origin}${location.pathname}?t=${encodeURIComponent(t)}`;
function extractToken(text) {
  const s = String(text || '');
  const m = s.match(/[?&]t=([a-f0-9]{32})\b/i) || s.match(/^\s*([a-f0-9]{32})\s*$/i);
  return m ? m[1].toLowerCase() : null;
}

/* ======================= guest card ======================= */
function renderCard(g, url, preview) {
  const meta = [g.table && `Table ${g.table}`, g.pkg].filter(Boolean).map(esc).join(' &nbsp;|&nbsp; ');
  const status = `<span class="${g.entry ? 'done' : ''}">${g.entry ? 'CHECKED IN &nbsp;•&nbsp; WELCOME' : 'VALID FOR ENTRY'}</span>`;
  let qr;
  try { qr = qrSvg(url); } catch (e) { qr = '<p class="small" style="color:#10291F">QR could not be drawn. Reload the page.</p>'; }
  app.innerHTML = `<div class="wrap">
    <article class="ticket"><div class="ticket-in">
      ${heading()}
      <h1 class="t-title">DIGITAL ACCESS PASS</h1>
      <h2 class="t-guest">${esc(g.name)}</h2>
      ${meta ? `<p class="t-meta">${meta}</p>` : ''}
      <div class="t-qr">${qr}</div>
      <p class="t-foot">${EVENT.foot}</p>
      <a class="t-addr" href="${EVENT.map}" target="_blank" rel="noopener">${EVENT.address}</a>
      <p class="t-rules"><span>STRICTLY BY INVITATION &nbsp;•&nbsp; ADULTS ONLY</span><span>ADMIT ONE &nbsp;•&nbsp; NON-TRANSFERABLE</span></p>
      <p class="t-status">${status}</p>
    </div></article>
    <p class="hint">${preview ? 'Design preview. No guest data is shown.' : 'Take a screenshot so your pass opens without signal. It is unique to you, so please do not share it.'}</p>
  </div>`;
}

async function viewCard(raw) {
  const t = String(raw).trim().toLowerCase();
  const url = cardUrl(t);
  const cached = store.get('mj_card_' + t);
  if (cached) renderCard(cached, url); else app.innerHTML = loadingView('Opening your card');
  try {
    const j = await api('card', { t });
    store.set('mj_card_' + t, j.guest);
    renderCard(j.guest, url);
  } catch (e) {
    if (e.code === 'INVALID') {
      store.del('mj_card_' + t);
      app.innerHTML = notice('This card is not active', 'If you think this is a mistake, please contact the wedding coordinator and they will check your details.');
    } else if (!cached) {
      app.innerHTML = notice('Your card could not load', e.message, `<button class="btn" onclick="location.reload()">Try again</button>`);
    }
  }
}

function viewLanding() {
  app.innerHTML = shell(`<p class="lead">Please open your personal access card using the link sent to you on WhatsApp.</p>`);
}

/* ======================= staff sign-in ======================= */
function viewLogin(pref) {
  const roles = [['FABRIC', 'Fabric'], ['ENTRY', 'Entry'], ['ADMIN', 'Admin']];
  let role = pref === 'admin' ? 'ADMIN' : (store.get('mj_lastrole') || 'ENTRY');
  app.innerHTML = `<div class="wrap">
    <div class="center mb"><h1 class="bar-title">Staff sign-in</h1></div>
    <form class="panel" id="lf" autocomplete="off" novalidate>
      <span class="label" style="margin-top:0">Station</span>
      <div class="seg" id="seg" role="radiogroup">${roles.map(([k, l]) => `<button type="button" role="radio" aria-checked="${k === role}" data-r="${k}" class="${k === role ? 'on' : ''}">${l}</button>`).join('')}</div>
      <label class="label" for="ln">Your name</label>
      <input class="input" id="ln" maxlength="40" value="${esc(store.get('mj_lastname') || '')}" autocomplete="name">
      <label class="label" for="lp">Passcode</label>
      <input class="input" id="lp" type="password" autocomplete="current-password">
      <p class="err" id="le" role="alert"></p>
      <button class="btn block" id="lb" type="submit">Sign in</button>
    </form></div>`;
  $('#seg').onclick = e => {
    const b = e.target.closest('[data-r]'); if (!b) return;
    role = b.dataset.r;
    document.querySelectorAll('#seg [data-r]').forEach(x => { const on = x === b; x.classList.toggle('on', on); x.setAttribute('aria-checked', on); });
  };
  $('#lf').onsubmit = async e => {
    e.preventDefault();
    const staff = $('#ln').value.trim(), pin = $('#lp').value;
    if (!staff) return void ($('#le').textContent = 'Enter your name so scans show who checked each guest.');
    if (!pin) return void ($('#le').textContent = 'Enter the passcode for this station.');
    $('#lb').disabled = true; $('#lb').textContent = 'Signing in…'; $('#le').textContent = '';
    try {
      const j = await api('login', { role, staff, pin });
      store.set('mj_session', { session: j.session, role: j.role, staff: j.staff });
      store.set('mj_lastrole', role); store.set('mj_lastname', staff);
      location.hash = j.role === 'ADMIN' ? '#admin' : '#scan-' + j.role.toLowerCase();
    } catch (err) {
      $('#le').textContent = err.message; $('#lb').disabled = false; $('#lb').textContent = 'Sign in';
    }
  };
}

async function signOut() {
  const s = session(); store.del('mj_session');
  if (s) api('logout', { session: s.session }).catch(() => {});
  location.hash = '#staff';
}

/* ======================= scanner ======================= */
const MODES = {
  fabric: { title: 'Aso Ebi collection', ok: 'Hand over fabric', used: 'Fabric already collected', verb: 'Mark collected' },
  entry: { title: 'Wedding entry', ok: 'Welcome in', used: 'Already checked in', verb: 'Check in' }
};
const cam = { stream: null, raf: 0, busy: false, key: '', keyAt: 0, mode: 'entry', canvas: null, ctx: null, lastTick: 0, audio: null, count: 0 };

function viewScanner(mode) {
  const s = session(); const M = MODES[mode];
  cam.mode = mode; cam.busy = false; cam.count = 0;
  app.innerHTML = `<div class="wrap">
    <header class="bar">
      <div><p class="bar-who">Signed in as ${esc(s.staff)}</p><h1 class="bar-title">${M.title}</h1></div>
      <button class="btn ghost sm" id="out">Sign out</button>
    </header>
    ${s.role === 'ADMIN' ? `<nav class="seg mb"><a href="#scan-fabric" class="${mode === 'fabric' ? 'on' : ''}">Fabric</a><a href="#scan-entry" class="${mode === 'entry' ? 'on' : ''}">Entry</a><a href="#admin">Dashboard</a></nav>` : ''}
    <div class="viewport">
      <video id="video" playsinline muted autoplay></video>
      <div class="reticle" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
      <div class="start" id="start"><button class="btn" id="go">Start scanning</button><p class="small">Allow camera access when Safari asks.</p></div>
    </div>
    <div class="scan-meta"><span><b id="cnt">0</b> done on this phone</span><button class="link" id="manual">Find guest by name</button></div>
    <div id="manualBox" class="panel mt" hidden>
      <label class="label" for="mq" style="margin-top:0">Guest name</label>
      <input class="input" id="mq" placeholder="Start typing a name" autocomplete="off">
      <div id="mres"></div>
    </div>
  </div>`;
  $('#out').onclick = signOut;
  $('#go').onclick = startCamera;
  $('#manual').onclick = () => { const b = $('#manualBox'); b.hidden = !b.hidden; if (!b.hidden) $('#mq').focus(); };
  let h;
  $('#mq').oninput = e => {
    clearTimeout(h); const q = e.target.value.trim();
    if (q.length < 2) { $('#mres').innerHTML = ''; return; }
    h = setTimeout(() => searchGuests(q), 350);
  };
}

async function startCamera() {
  const box = $('#start');
  try {
    if (!cam.audio) { const AC = window.AudioContext || window.webkitAudioContext; if (AC) cam.audio = new AC(); }
    if (cam.audio && cam.audio.state === 'suspended') cam.audio.resume();
    box.innerHTML = '<div class="spin"></div>';
    await loadScript(JSQR_URL);
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error('This browser cannot use the camera. Open this page in Safari.');
    cam.stream = await navigator.mediaDevices.getUserMedia({ audio: false, video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } } });
    const v = $('#video');
    if (!v) return stopCamera();
    v.srcObject = cam.stream;
    await v.play();
    box.hidden = true;
    cam.canvas = document.createElement('canvas');
    cam.ctx = cam.canvas.getContext('2d', { willReadFrequently: true });
    cam.raf = requestAnimationFrame(tick);
  } catch (e) {
    stopCamera();
    const msg = e.name === 'NotAllowedError'
      ? 'Camera is blocked. In Safari tap aA → Website Settings → Camera → Allow, then try again.'
      : (e.message || 'The camera did not start.');
    box.hidden = false;
    box.innerHTML = `<p class="small">${esc(msg)}</p><button class="btn" id="go">Try again</button>`;
    $('#go').onclick = startCamera;
  }
}

function stopCamera() {
  cancelAnimationFrame(cam.raf); cam.raf = 0;
  if (cam.stream) { cam.stream.getTracks().forEach(t => t.stop()); cam.stream = null; }
}

function tick(ts) {
  cam.raf = requestAnimationFrame(tick);
  const v = $('#video');
  if (!v || cam.busy || v.readyState < 2 || !v.videoWidth || ts - cam.lastTick < 120) return;
  cam.lastTick = ts;
  const w = 640, h = Math.round(w * v.videoHeight / v.videoWidth);
  if (cam.canvas.width !== w) cam.canvas.width = w;
  if (cam.canvas.height !== h) cam.canvas.height = h;
  cam.ctx.drawImage(v, 0, 0, w, h);
  const img = cam.ctx.getImageData(0, 0, w, h);
  const code = window.jsQR ? jsQR(img.data, w, h, { inversionAttempts: 'dontInvert' }) : null;
  if (code && code.data) onCode(code.data);
}

function onCode(text) {
  const t = extractToken(text);
  const key = t || text, now = Date.now();
  if (key === cam.key && now - cam.keyAt < 6000) return;   // same card still in view
  cam.key = key; cam.keyAt = now;
  if (!t) return showResult({ result: 'INVALID', detail: 'This is not a Mary & Joseph access code.' });
  submitScan({ t });
}

async function submitScan(payload) {
  const s = session();
  if (!s) return route();
  showResult({ result: 'CHECKING' });
  try { showResult(await api('scan', Object.assign({ session: s.session, mode: cam.mode }, payload))); }
  catch (e) { if (!authFail(e)) { cam.key = ''; showResult({ result: 'ERROR', detail: e.message }); } }
}

function showResult(r) {
  cam.busy = true;
  let el = $('#result');
  if (!el) { el = document.createElement('div'); el.id = 'result'; el.setAttribute('role', 'alert'); document.body.appendChild(el); }
  if (r.result === 'CHECKING') { el.className = 'result check'; el.innerHTML = '<div class="spin lg"></div><p class="det">Checking</p>'; return; }
  const g = r.guest || {}, M = MODES[cam.mode];
  const meta = [g.table && `Table ${g.table}`, g.pkg].filter(Boolean).map(esc).join(', ');
  const V = {
    OK: ['ok', '✓', M.ok, meta],
    ALREADY_USED: ['bad', '!', M.used, `First scanned ${esc(r.at)}${r.by ? ` by ${esc(r.by)}` : ''}`],
    NOT_PAID: ['warn', '£', 'Payment not confirmed', 'Send the guest to the coordinator.'],
    INVALID: ['bad', '✕', 'Code not recognised', esc(r.detail || 'This card is not on the guest list or has been replaced.')],
    ERROR: ['err', '?', 'Could not check', esc(r.detail || 'Try again.')]
  }[r.result] || ['err', '?', 'Could not check', 'Try again.'];
  el.className = 'result ' + V[0];
  el.innerHTML = `<div class="icon" aria-hidden="true">${V[1]}</div><p class="big">${V[2]}</p>
    ${g.name ? `<p class="who">${esc(g.name)}</p>` : ''}${V[3] ? `<p class="det">${V[3]}</p>` : ''}
    <button class="btn" id="next">${r.result === 'OK' ? 'Next guest' : 'Continue'}</button>`;
  $('#next').onclick = hideResult;
  beep(r.result === 'OK');
  if (r.result === 'OK') {
    cam.count++; const c = $('#cnt'); if (c) c.textContent = cam.count;
    later(hideResult, 2400);
  }
}

function hideResult() { const el = $('#result'); if (el) el.remove(); cam.busy = false; }

function beep(ok) {
  try {
    const a = cam.audio; if (!a) return;
    const o = a.createOscillator(), g = a.createGain(), t = a.currentTime;
    o.type = ok ? 'sine' : 'square'; o.frequency.value = ok ? 880 : 200;
    o.connect(g); g.connect(a.destination);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.25, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + (ok ? 0.18 : 0.5));
    o.start(t); o.stop(t + (ok ? 0.2 : 0.55));
  } catch (e) {}
  if (navigator.vibrate) navigator.vibrate(ok ? 60 : [90, 60, 90]);
}

async function searchGuests(q) {
  const box = $('#mres'); if (!box) return;
  box.innerHTML = '<div class="spin"></div>';
  try {
    const j = await api('search', { session: session().session, q });
    const M = MODES[cam.mode];
    box.innerHTML = j.results.length ? j.results.map(g => {
      const used = cam.mode === 'fabric' ? g.fabric : g.entry;
      const sub = [g.table && `Table ${esc(g.table)}`, !g.paid && 'Payment not confirmed', used && 'Already done'].filter(Boolean).join(', ');
      return `<div class="m-row"><div><p class="g-name">${esc(g.name)}</p>${sub ? `<p class="g-sub">${sub}</p>` : ''}</div>
        <button class="btn sm" data-id="${esc(g.id)}" data-name="${esc(g.name)}">${M.verb}</button></div>`;
    }).join('') : '<p class="small mt">No guest matches that name.</p>';
    box.querySelectorAll('[data-id]').forEach(b => b.onclick = () => {
      if (confirm(`${M.verb}: ${b.dataset.name}?`)) submitScan({ id: b.dataset.id });
    });
  } catch (e) { if (!authFail(e)) box.innerHTML = `<p class="err">${esc(e.message)}</p>`; }
}

document.addEventListener('visibilitychange', () => {
  if (document.hidden || !cam.stream) return;
  if (cam.stream.getVideoTracks().some(t => t.readyState === 'ended')) {
    stopCamera();
    const b = $('#start');
    if (b) { b.hidden = false; b.innerHTML = '<button class="btn" id="go">Resume camera</button>'; $('#go').onclick = startCamera; }
  }
});

/* ======================= WhatsApp message ======================= */
function waNumber(raw) {
  let p = String(raw || '').replace(/[^\d+]/g, '');
  if (p.indexOf('+') === 0) p = p.slice(1);
  else if (p.indexOf('00') === 0) p = p.slice(2);
  else if (p.indexOf('0') === 0) p = '44' + p.slice(1);
  else if (/^7\d{9}$/.test(p)) p = '44' + p;
  p = p.replace(/\D/g, '');
  return p.length >= 10 ? p : '';
}
function waMessage(name, link) {
  const first = String(name).trim().split(/\s+/)[0];
  return `Dear ${first},\n\n` +
    `Here is your personal entry pass for the traditional wedding of Mary & Joseph on Thursday 25 March 2027 at Meridian Grand, Advent Way, London N18 3AF:\n${link}\n\n` +
    `Please show the QR code at the entrance on the day. It is unique to you, so please do not share it. Kindly note the celebration is strictly by invitation and adults only.\n\n` +
    `Thank you, and we can't wait to see you!\n\n` +
    `With love,\nMary & Joseph`;
}
function waLink(g) {
  const num = waNumber(g.phone), text = encodeURIComponent(waMessage(g.name, g.link));
  return num ? `https://wa.me/${num}?text=${text}` : `https://wa.me/?text=${text}`;
}

/* ======================= admin dashboard ======================= */
const A = { guests: [], q: '', f: 'all' };
const FILTERS = {
  all: ['All guests', () => true],
  issue: ['Paid, no card yet', g => g.paid && !g.issued],
  send: ['Card not sent', g => g.paid && g.issued && !g.sent],
  pending: ['Payment pending', g => !g.paid],
  fabricTodo: ['Fabric not collected', g => g.paid && !g.fabric],
  arrived: ['Checked in', g => !!g.entry],
  notArrived: ['Not arrived', g => g.paid && !g.entry]
};

function viewAdmin() {
  const s = session();
  app.innerHTML = `<div class="wrap wide">
    <header class="bar">
      <div><p class="bar-who">Admin: ${esc(s.staff)}</p><h1 class="bar-title">Guest dashboard</h1></div>
      <button class="btn ghost sm" id="out">Sign out</button>
    </header>
    <nav class="seg mb"><a href="#scan-fabric">Scan fabric</a><a href="#scan-entry">Scan entry</a><a href="#admin" class="on">Dashboard</a></nav>
    <div class="stats" id="stats"></div>
    <button class="btn block mt" id="issue">Issue cards to confirmed guests</button>
    <div class="filters">
      <input class="input" id="aq" type="search" placeholder="Name, ID, table or phone" value="${esc(A.q)}">
      <select class="input" id="af" aria-label="Filter">${Object.entries(FILTERS).map(([k, [l]]) => `<option value="${k}" ${k === A.f ? 'selected' : ''}>${l}</option>`).join('')}</select>
      <button class="btn ghost sm" id="ar" style="min-height:50px" aria-label="Refresh">↻</button>
    </div>
    <div id="list"><div class="spin"></div></div>
  </div>`;
  $('#out').onclick = signOut;
  $('#aq').oninput = e => { A.q = e.target.value; renderList(); };
  $('#af').onchange = e => { A.f = e.target.value; renderList(); };
  $('#ar').onclick = () => loadGuests();
  $('#issue').onclick = issueAll;
  $('#list').onclick = onListClick;
  loadGuests();
  adminPoll = setInterval(() => { if (!document.hidden && !document.querySelector('.more[open]')) loadGuests(true); }, 45000);
}

async function loadGuests(silent) {
  try {
    const j = await api('guests', { session: session().session });
    A.guests = j.guests; renderStats(); renderList();
  } catch (e) {
    if (authFail(e)) return;
    if (silent) toast(e.message); else if ($('#list')) $('#list').innerHTML = `<p class="err">${esc(e.message)}</p>`;
  }
}

function renderStats() {
  const el = $('#stats'); if (!el) return;
  const paid = A.guests.filter(g => g.paid), P = paid.length;
  const cell = (n, label, of) => `<div class="stat"><b>${n}</b><span>${label}</span>${of != null ? `<br><small>of ${of}</small>` : ''}</div>`;
  el.innerHTML = cell(A.guests.length, 'On the list') + cell(P, 'Paid') + cell(paid.filter(g => g.issued).length, 'Cards issued', P) +
    cell(paid.filter(g => g.sent).length, 'Sent', P) + cell(paid.filter(g => g.fabric).length, 'Fabric collected', P) +
    cell(paid.filter(g => g.entry).length, 'Checked in', P);
}

function renderList() {
  const el = $('#list'); if (!el) return;
  const q = A.q.trim().toLowerCase(), fn = FILTERS[A.f][1];
  const rows = A.guests.filter(g => fn(g) && (!q || [g.name, g.id, g.table, g.phone].join(' ').toLowerCase().includes(q)));
  el.innerHTML = rows.length ? rows.map(guestRow).join('')
    : `<p class="empty">${A.guests.length ? 'No guests match this search or filter.' : 'No guests yet. Add them to the Guests tab of the Google Sheet, then refresh.'}</p>`;
}

function guestRow(g) {
  const badge = (cls, text) => `<span class="b ${cls}">${esc(text)}</span>`;
  const badges = [
    g.paid ? badge('g', 'Paid') : badge('r', g.payment || 'Pending'),
    g.paid && badge(g.issued ? 'y' : '', g.issued ? 'Card issued' : 'No card yet'),
    g.issued && badge(g.sent ? 'y' : '', g.sent ? `Sent ${g.sent}` : 'Not sent'),
    g.fabric && badge('g', `Fabric ${g.fabric}`),
    g.entry && badge('g', `Arrived ${g.entry}`)
  ].filter(Boolean).join('');
  const sub = [g.id, g.table && `Table ${g.table}`, g.pkg, g.side].filter(Boolean).map(esc).join(', ');
  const actions = g.paid && g.issued ? `<div class="g-actions">
      <button class="btn sm" data-a="wa">Send on WhatsApp</button>
      <button class="btn ghost sm" data-a="copy">Copy link</button>
      <a class="btn ghost sm" href="${esc(g.link)}" target="_blank" rel="noopener">View card</a>
      <details class="more"><summary class="btn ghost sm">More</summary><div class="menu">
        ${g.fabric ? '<button data-a="reset-fabric">Undo fabric collection</button>' : ''}
        ${g.entry ? '<button data-a="reset-entry">Undo check-in</button>' : ''}
        ${!g.sent ? '<button data-a="sent">Mark as sent</button>' : ''}
        <button data-a="revoke" class="danger">Replace QR code (old one stops working)</button>
      </div></details></div>` : '';
  return `<div class="g" data-id="${esc(g.id)}"><p class="g-name">${esc(g.name)}</p><p class="g-sub">${sub}</p><div class="badges">${badges}</div>${actions}</div>`;
}

async function onListClick(e) {
  const btn = e.target.closest('[data-a]'); if (!btn) return;
  const id = btn.closest('.g').dataset.id, g = A.guests.find(x => x.id === id); if (!g) return;
  const a = btn.dataset.a, sid = session().session;
  try {
    if (a === 'wa') {
      window.open(waLink(g), '_blank');
      if (!g.phone) toast('No number on file. Choose the contact in WhatsApp.');
      if (!g.sent) { await api('markSent', { session: sid, id }); g.sent = 'just now'; renderStats(); renderList(); }
    } else if (a === 'copy') {
      try { await navigator.clipboard.writeText(g.link); toast('Card link copied'); }
      catch (err) { prompt('Copy this card link', g.link); }
    } else if (a === 'sent') {
      await api('markSent', { session: sid, id }); toast('Marked as sent'); loadGuests(true);
    } else if (a.indexOf('reset-') === 0) {
      const mode = a.slice(6);
      if (!confirm(`Undo ${mode === 'fabric' ? 'fabric collection' : 'check-in'} for ${g.name}? Their QR will work again for this.`)) return;
      await api('reset', { session: sid, id, mode }); toast('Undone'); loadGuests(true);
    } else if (a === 'revoke') {
      if (!confirm(`Replace ${g.name}'s QR code? The old card stops working immediately and you will need to send the new link.`)) return;
      await api('revoke', { session: sid, id }); toast('New code issued. Send it again.'); loadGuests(true);
    }
  } catch (err) { if (!authFail(err)) toast(err.message); }
}

async function issueAll() {
  const btn = $('#issue');
  const todo = A.guests.filter(FILTERS.issue[1]).length;
  if (!confirm(todo ? `Create cards for ${todo} paid guest(s) without one?` : 'Rebuild links for all confirmed guests?')) return;
  btn.disabled = true; btn.textContent = 'Issuing…';
  try { const j = await api('issue', { session: session().session }); toast(`${j.issued} new card(s) issued`); await loadGuests(true); }
  catch (e) { if (!authFail(e)) toast(e.message); }
  finally { btn.disabled = false; btn.textContent = 'Issue cards to confirmed guests'; }
}

/* ======================= router ======================= */
function route() {
  timers.forEach(clearTimeout); timers = [];
  if (adminPoll) { clearInterval(adminPoll); adminPoll = null; }
  stopCamera(); hideResult();
  const p = new URLSearchParams(location.search);
  const h = location.hash.slice(1);
  window.scrollTo(0, 0);
  if (p.get('t')) return viewCard(p.get('t'));
  if (p.has('preview')) return renderCard({ name: 'Guest Name', table: '', pkg: '' }, cardUrl('preview'), true);
  if (['staff', 'admin', 'scan-fabric', 'scan-entry'].indexOf(h) === -1) return viewLanding();
  const s = session();
  if (!s) return viewLogin(h);
  if (h === 'scan-fabric' || h === 'scan-entry') {
    const mode = h.slice(5);
    if (s.role !== 'ADMIN' && s.role.toLowerCase() !== mode) return location.replace('#scan-' + s.role.toLowerCase());
    return viewScanner(mode);
  }
  if (s.role === 'ADMIN') return viewAdmin();
  location.replace('#scan-' + s.role.toLowerCase());
}
window.addEventListener('hashchange', route);
route();
</script>
